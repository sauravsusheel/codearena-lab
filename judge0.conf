# ==============================================================================
# UniSphere CodeArena - Judge0 CE Hardened Security Configuration
# ==============================================================================

# Network Isolation: Completely eliminates SSRF, DNS queries, and outbound connections
ENABLE_NETWORK=false

# Time Limits (Strictly terminates infinite loops: while(1) / fork bombs)
CPU_TIME_LIMIT=5.0
MAX_CPU_TIME_LIMIT=10.0
WALL_TIME_LIMIT=10.0
MAX_WALL_TIME_LIMIT=15.0

# Memory Limits (256 MB per submission ceiling)
MEMORY_LIMIT=262144
MAX_MEMORY_LIMIT=262144

# Stack Size & Process Concurrency
STACK_LIMIT=64000
MAX_STACK_LIMIT=64000
MAX_PROCESSES_AND_OR_THREADS=64
MAX_MAX_PROCESSES_AND_OR_THREADS=128

# File & Output Caps (Prevents disk filling attacks: e.g. yes > file.txt)
MAX_FILE_SIZE=4096
MAX_MAX_FILE_SIZE=8192
NUMBER_OF_RUNS=1

# Security Hardening
ENABLE_COMPILER_OPTIONS=false
ALLOWED_LANGUAGES_FOR_COMPILE_OPTIONS=
ENABLE_SYNCHRONOUS_EXECUTION=false

# Queue Concurrency (Handles concurrent exam students via background jobs)
MAX_QUEUE_SIZE=2000
WORKER_CONCURRENCY=4
